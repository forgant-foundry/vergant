name: delivery

on:
  push:
    branches:
      - '**'

jobs:
  delivery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o vergant ./cmd/vergant

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Apply version
        id: version
        run: echo "tag=$(./vergant new)" >> $GITHUB_OUTPUT

      - name: Build release binaries
        if: startsWith(steps.version.outputs.tag, 'r')
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SEM="${VERSION#r}"
          LDFLAGS="-s -w"
          mkdir -p dist

          GOOS=linux  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/vergant ./cmd/vergant
          tar czf "dist/vergant_${SEM}_linux_amd64.tar.gz" -C /tmp vergant

          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/vergant ./cmd/vergant
          tar czf "dist/vergant_${SEM}_darwin_amd64.tar.gz" -C /tmp vergant

          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o /tmp/vergant ./cmd/vergant
          tar czf "dist/vergant_${SEM}_darwin_arm64.tar.gz" -C /tmp vergant

          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/vergant.exe ./cmd/vergant
          cd /tmp && zip "${GITHUB_WORKSPACE}/dist/vergant_${SEM}_windows_amd64.zip" vergant.exe && cd -

          cd dist && sha256sum *.tar.gz *.zip > "vergant_${SEM}_checksums.txt"

      - name: Create release
        if: startsWith(steps.version.outputs.tag, 'r')
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          gh release create "$VERSION" \
            --title "${VERSION#r}" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
